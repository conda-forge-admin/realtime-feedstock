schema_version: 1

context:
  name: realtime
  version: "2.34.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: 5a739f78f7af3fe4ae2117dc41a52c8c73e60dc2bde1d3a2d0e8990a160ab81d

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - poetry-core >=1.0.0
  run:
    - python >=${{ python_min }}
    - websockets >=11,<16
    - typing-extensions >=4.14.0
    - pydantic >=2.11.7,<3.0.0
    - httpx >=0.26,<0.29
    - h2 >=3,<5
    # - aiohttp >=3.12.14
    # - python-dateutil >=2.8.1

tests:
  - python:
      imports:
        - realtime
      pip_check: true
      python_version:
        - ${{ python_min }}
        - "*"

about:
  license: MIT
  license_file: LICENSE
  summary: A Python Client for Phoenix Channels
  description: A Python Client for Phoenix Channels
  homepage: https://github.com/supabase/supabase-py/tree/main/src/realtime

extra:
  recipe-maintainers:
    - timkpaine
    - J0
    - anand2312
